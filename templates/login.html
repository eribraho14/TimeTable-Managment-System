{% load static %}

<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>FEUT TimeTable Managment System</title>
    <link rel="shortcut icon" href="{% static 'assets/img/logo-small.png' %}">
    <!-- Bootstrap Core CSS -->
    <link href="{% static 'assets/vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
          rel="stylesheet">
    
    <!-- Custom styles for this template-->
    <link href="{% static 'assets/css/sb-admin-2.min.css' %}" rel="stylesheet">

    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

</head>

<body class="bg-gradient-primary">
   
    <div class="container">
        {% include 'alert.html' %}

        <!-- Outer Row -->
        <div class="row justify-content-center">

            <div class="col-xl-10 col-lg-12 col-md-9">
               
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <!-- Nested Row within Card Body -->
                        <div class="row">
                           
                            <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
                            <div class="col-lg-6">
                                <div class="p-5">
                                    <div class="text-center" style="margin-bottom: 20%;">
                                        <h1 class="h4 text-gray-900 mb-4" >Please Sign In</h1>
                                    </div>
                                    <form action="" method="POST" role="form">
                                        {% csrf_token %}
                                        <fieldset>
                                            <div class="form-group" style="margin-bottom: 7%;">
                                                <input class="form-control" placeholder="username" name="username" type="text" autofocus>
                                            </div>
                                            <div class="form-group">
                                                <input class="form-control" placeholder="Password" name="password" type="password" value="">
                                            </div>
                                            <div class="checkbox" style="margin-top: 2%;" >
                                                <label>
                                                    <input name="remember" type="checkbox" value="Remember Me"> Remember Me
                                                </label>
                                            </div>
                                            <!-- Change this to a button or input when using this as a form -->
                                            <button type="submit" class="btn btn-lg btn-success btn-block">Login</button>
                                       
                                        <span style="color: transparent;">
                                            
                                        </span>
                                    </form>
                                    
                                  
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>
    <style>
        button {margin-top: 20%;}
       
        .container{
            margin-top: 3%;
        }
        button.close{
            display: none;
        }
    </style>
    

    <!-- Bootstrap core JavaScript-->
 
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="{% static 'assets/vendor/jquery-easing/jquery.easing.min.js'%}"></script>

    <!-- Custom scripts for all pages-->
    <script src="{% static 'assets/js/sb-admin-2.min.js'%}"></script>
    <script src="{% static 'assets/vendor/jquery-easing/jquery.easing.min.js'%}"></script>

</body>

</html>
